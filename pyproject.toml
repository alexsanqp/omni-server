[project]
name = "omni-server"
version = "0.1.0"
description = "Standalone GPU service exposing OmniParser v2 parsing over HTTP. Clients talk to it via OMNIPARSER_URL."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.32.0",
    "Pillow>=11.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
# Real inference stack. Pulls 3+ GB of CUDA wheels — only needed on the GPU box.
# `uv sync --extra gpu` requires access to the cu124 torch index (below).
gpu = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers==4.49.0",
    "accelerate>=1.0.0",
    "ultralytics==8.3.70",
    "easyocr>=1.7.0",
    "paddlepaddle>=2.6.0,<3.0.0",
    "paddleocr>=2.7.0,<3.0.0",
    "huggingface-hub>=0.26.0",
    "opencv-python>=4.10.0",
    "einops>=0.8.0",
    "supervision==0.18.0",
    "timm>=1.0.0",
    "numpy>=1.26,<2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
omni-server = "omni_server.__main__:main"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_server"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor", ".venv", "weights"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF", "S", "T20"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
# CLI utilities — prints are their UI; subprocess/urlopen take operator input.
"scripts/**" = ["T20", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# The vendored OmniParser + GPU stack are untyped and not present in CI.
exclude = ["vendor", "scripts"]

[[tool.mypy.overrides]]
module = ["util.*", "torch.*", "ultralytics.*", "easyocr.*", "paddleocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
