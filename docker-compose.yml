# omni-server on the GPU host. Requires the NVIDIA Container Toolkit.
#   docker compose up -d --build
#   docker compose logs -f
services:
  omni-server:
    build: .
    image: omni-server:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      OMNI_HOST: "0.0.0.0"
      OMNI_PORT: "8001"
      OMNI_REAL_MODEL: "1"
      HF_HOME: "/root/.cache/huggingface"
    volumes:
      - omni-weights:/app/weights      # ~1 GB OmniParser weights (downloaded once)
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  omni-weights:
  hf-cache:
