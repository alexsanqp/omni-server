# omni-server on the GPU host. Requires the NVIDIA Container Toolkit.
#   docker compose up -d --build
#   docker compose logs -f
services:
  omni-server:
    build: .
    image: omni-server:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      # Optional: a fresh clone has no .env (it is git-ignored). Every setting
      # has a default, and the essentials are set in `environment:` below, so the
      # documented `docker compose up` works with no .env present.
      # NOTE: the path/required mapping form needs Docker Compose v2.24+ (Jan 2024).
      - path: .env
        required: false
    environment:
      OMNI_HOST: "0.0.0.0"
      OMNI_PORT: "8001"
      HF_HOME: "/root/.cache/huggingface"
    volumes:
      - omni-weights:/app/weights      # ~1 GB OmniParser weights (downloaded once)
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  omni-weights:
  hf-cache:
