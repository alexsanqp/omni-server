name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + tests (no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tests inject a fake pipeline, so the wire contract runs with no torch/weights.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # No uv.lock is committed (deps resolve from pyproject ranges), so key
          # the cache on pyproject.toml. setup-uv's default glob is **/uv.lock,
          # which matches nothing here and fails the step.
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (base + dev, no gpu)
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy omni_server

      - name: Tests (fake pipeline, no GPU)
        run: uv run pytest
